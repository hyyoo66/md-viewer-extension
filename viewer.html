<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD 뷰어</title>
<link rel="stylesheet" href="viewer.css">
<script src="mathjax-config.js"></script>
<script src="lib/mathjax/tex-chtml.js"></script>
<script src="lib/docx.umd.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="core.js"></script>
<script src="viewer.js" defer></script>
</head>
<body>
<header id="toolbar">
  <strong class="brand">md → pdf / docx</strong>
  <span class="ver" id="ver"></span>
  <span class="sep"></span>
  <span class="lbl">저장명</span><span class="fname" id="fname">—</span>
  <span class="sep"></span>
  <label class="opt"><input type="checkbox" id="optHr" checked> H2 자동줄</label>
  <label class="opt"><input type="checkbox" id="optSub" checked> 소제목 자동감지</label>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button type="button" class="btn" id="btnReload" title="파일을 다시 읽습니다 (F5와 같음, 보던 위치 유지)">↻ 새로고침</button>
  <button type="button" class="btn primary" id="btnPdf" title="인쇄 창에서 'PDF로 저장'을 선택하세요">PDF로 저장</button>
  <button type="button" class="btn primary" id="btnDocx">.docx로 저장</button>
</header>
<main id="stage">
  <article id="paper"></article>
</main>
</body>
</html>
